# `docker compose up -d postgres redis` starts only the databases, for running the
# services from a virtualenv. `docker compose up -d` runs the whole stack from the
# same image the deployment runs, with the UI at http://localhost:8000.
#
# Every app service is the same image; SERVICE_ROLE picks the process.

x-app: &app
  build: .
  image: openweave
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-app-env: &app-env
  DATABASE_URL: postgresql://agentobs:agentobs@postgres:5432/agentobs
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:15
    container_name: agentobs-postgres
    environment:
      POSTGRES_USER: agentobs
      POSTGRES_PASSWORD: agentobs
      POSTGRES_DB: agentobs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentobs"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: agentobs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Only with `docker compose --profile ollama up -d`.
  ollama:
    image: ollama/ollama:latest
    container_name: agentobs-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  api:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_ROLE: api
      PUBLIC_DEMO_PROJECT: ${PUBLIC_DEMO_PROJECT:-}
    ports:
      - "8000:8000"

  ingestion:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_ROLE: ingestion
    ports:
      - "50051:50051"

  worker:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_ROLE: worker

  eval-worker:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_ROLE: eval-worker
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_HOST: http://ollama:11434

volumes:
  postgres-data:
  redis-data:
  ollama-data:
