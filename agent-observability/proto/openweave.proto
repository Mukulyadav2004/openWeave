syntax = "proto3";

package openweave.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ============================================================================
// OpenWeave ingestion protocol — v2
//
// Five changes from v1, each of which is worth being able to explain:
//
//  1. BATCH, not one-RPC-per-trace. v1 made a blocking gRPC call inside the
//     caller's hot path for every single trace. The SDK now buffers events and
//     flushes N at a time from a background thread. This is the single biggest
//     throughput and caller-latency win in the whole rewrite.
//
//  2. EVENT ENVELOPE with a `oneof` body. v1 could only ever express "a trace
//     happened". Adding a new object type meant a new RPC and a new server
//     path. New event types are now additive and wire-compatible.
//
//  3. CREATE/UPDATE SPLIT for observations. A span is recorded when it starts;
//     its end_time, output, and token usage are not known until it finishes.
//     v1's single flat message could not represent an in-flight span at all,
//     which is why it could not represent nesting either.
//
//  4. event_id FOR IDEMPOTENCY. Client-generated UUID, unique per event. The
//     worker upserts on it, so a retried batch after a network timeout is safe.
//     v1 relied on a primary-key collision, which silently dropped legitimate
//     updates to an existing span.
//
//  5. PARTIAL FAILURE. The response reports per-event errors instead of
//     failing the whole batch. One malformed span in a batch of 200 must not
//     cost you the other 199.
// ============================================================================


// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// Mirrors ObservationType in db/models.py. UNSPECIFIED = 0 is required by
// proto3 style and acts as the "SDK is older than the server" signal.
enum ObservationType {
  OBSERVATION_TYPE_UNSPECIFIED = 0;
  OBSERVATION_TYPE_SPAN        = 1;  // generic unit of work
  OBSERVATION_TYPE_GENERATION  = 2;  // an LLM call — the only type with cost
  OBSERVATION_TYPE_EVENT       = 3;  // a point in time, no duration
  OBSERVATION_TYPE_AGENT       = 4;
  OBSERVATION_TYPE_TOOL        = 5;
  OBSERVATION_TYPE_CHAIN       = 6;
  OBSERVATION_TYPE_RETRIEVER   = 7;
  OBSERVATION_TYPE_EMBEDDING   = 8;
  OBSERVATION_TYPE_GUARDRAIL   = 9;
}

enum ObservationLevel {
  OBSERVATION_LEVEL_UNSPECIFIED = 0;
  OBSERVATION_LEVEL_DEBUG       = 1;
  OBSERVATION_LEVEL_DEFAULT     = 2;
  OBSERVATION_LEVEL_WARNING     = 3;
  OBSERVATION_LEVEL_ERROR       = 4;
}

enum ScoreDataType {
  SCORE_DATA_TYPE_UNSPECIFIED = 0;
  SCORE_DATA_TYPE_NUMERIC     = 1;
  SCORE_DATA_TYPE_CATEGORICAL = 2;
  SCORE_DATA_TYPE_BOOLEAN     = 3;
}


// ---------------------------------------------------------------------------
// Bodies
// ---------------------------------------------------------------------------

// A container for one agent run. Note how little is on it now — everything
// that used to be here (input, output, latency, model, tokens) moved to
// Observation, because an agent run has many of each.
message TraceBody {
  string id                              = 1;
  string name                            = 2;
  string user_id                         = 3;
  string session_id                      = 4;
  google.protobuf.Timestamp timestamp    = 5;

  string input                           = 6;
  string output                          = 7;

  google.protobuf.Struct metadata        = 8;
  repeated string tags                   = 9;

  // Code version that produced this trace. Cheap to send, and it is what makes
  // "did quality regress after the v1.4 deploy?" answerable.
  string release                         = 10;
  string version                         = 11;

  // Set by the experiment runner so eval traffic can be excluded from
  // production cost and latency dashboards.
  bool is_experiment                     = 12;
}

// One node in the trace tree. Used by BOTH observation_create and
// observation_update — the server treats it as a sparse patch on update, so
// the SDK only has to send the fields it learned.
message ObservationBody {
  string id                                        = 1;
  string trace_id                                  = 2;
  // Empty string = root observation of the trace. THE field that makes
  // waterfalls possible.
  string parent_observation_id                     = 3;

  ObservationType type                             = 4;
  string name                                      = 5;

  google.protobuf.Timestamp start_time             = 6;
  google.protobuf.Timestamp end_time               = 7;
  // When the first streamed token arrived. Server derives TTFT from this.
  google.protobuf.Timestamp completion_start_time  = 8;

  ObservationLevel level                           = 9;
  // Exception type + message when the wrapped call raised. v1's SDK emitted
  // nothing at all on failure, so errors were invisible — this is the fix.
  string status_message                            = 10;

  string input                                     = 11;
  string output                                    = 12;
  google.protobuf.Struct metadata                  = 13;

  // --- GENERATION only ---------------------------------------------------
  string model                                     = 20;
  google.protobuf.Struct model_parameters          = 21;

  // Maps, not fixed fields: {"input": 1200, "output": 340, "cache_read": 800}.
  // New token types ship faster than schema migrations do.
  map<string, uint64> usage_details                = 22;
  // Optional. If the SDK knows the real cost, send it; otherwise the server
  // resolves it from the price table. Both are stored separately so a bad
  // price table can be re-run without losing what the client reported.
  map<string, double> cost_details                 = 23;

  // --- prompt linkage ----------------------------------------------------
  string prompt_name                               = 24;
  int32  prompt_version                            = 25;
}

// A quality measurement. Anchors to a trace, an observation within it, or a
// dataset run item — exactly one.
message ScoreBody {
  string id                    = 1;

  string trace_id              = 2;
  string observation_id        = 3;
  string dataset_run_item_id   = 4;

  string name                  = 5;
  ScoreDataType data_type      = 6;
  double value                 = 7;   // NUMERIC / BOOLEAN
  string string_value          = 8;   // CATEGORICAL

  string comment               = 9;
  // source is NOT on the wire: it is derived server-side from the credential.
  // An SDK cannot claim its score came from a human annotator.
}


// ---------------------------------------------------------------------------
// Envelope
// ---------------------------------------------------------------------------

message Event {
  // Client-generated UUID, stable across retries. The worker upserts on this,
  // which is what makes at-least-once delivery safe end to end.
  string event_id                     = 1;
  // When the SDK created the event, not when the server received it. Needed to
  // order create/update pairs that arrive out of order over the queue.
  google.protobuf.Timestamp timestamp = 2;

  oneof body {
    TraceBody       trace_create       = 10;
    ObservationBody observation_create = 11;
    ObservationBody observation_update = 12;
    ScoreBody       score_create       = 13;
  }
}

message IngestBatchRequest {
  repeated Event events = 1;
  // SDK name/version, e.g. "openweave-python/2.0.1". Log it — when someone
  // reports bad data, the first question is always which SDK build produced it.
  string sdk = 2;
}

message EventError {
  string event_id = 1;
  // 400 validation, 403 wrong project, 429 rate limited, 500 server.
  int32  code     = 2;
  string message  = 3;
}

message IngestBatchResponse {
  int32 accepted            = 1;
  repeated EventError errors = 2;
}


// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service IngestionService {
  // Auth: an `authorization: Basic base64(public_key:secret_key)` metadata
  // header, verified by a server interceptor. project_id is resolved from the
  // key and injected server-side — it is deliberately NOT a field on any
  // message above, so a client cannot write into someone else's project.
  rpc IngestBatch(IngestBatchRequest) returns (IngestBatchResponse);

  // For k8s liveness/readiness probes. v1's deployments had no probes at all,
  // so a wedged pod stayed in the Service's endpoint list indefinitely.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message HealthResponse {
  bool ok            = 1;
  string version     = 2;
  bool redis_ok      = 3;
}
