syntax = "proto3";

package openweave.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ============================================================================
// OpenWeave ingestion protocol — v2
//
//  1. BATCH, not one-RPC-per-trace. The SDK buffers and flushes N at a time.
//  2. EVENT ENVELOPE (`oneof`), so new object types are additive.
//  3. CREATE/UPDATE SPLIT — a span is recorded when it starts; end_time,
//     output and token usage are not known until it finishes.
//  4. event_id for idempotency; retried batches are safe.
//  5. PARTIAL FAILURE — one bad span must not cost you the other 199.
//
// NOTE ON `optional`: every ObservationBody field below is marked `optional`.
// That is load-bearing, not stylistic. Plain proto3 scalars have no field
// presence — an unset string and "" are indistinguishable on the wire. Since
// observation_update is applied as a SPARSE PATCH, the server must be able to
// tell "this field was not sent" from "set this field to empty", or every
// update would wipe the fields it did not carry. `optional` gives presence,
// and MessageToDict then omits unset fields entirely.
// ============================================================================


enum ObservationType {
  OBSERVATION_TYPE_UNSPECIFIED = 0;
  OBSERVATION_TYPE_SPAN        = 1;  // generic unit of work
  OBSERVATION_TYPE_GENERATION  = 2;  // an LLM call — the only type with cost
  OBSERVATION_TYPE_EVENT       = 3;  // a point in time, no duration
  OBSERVATION_TYPE_AGENT       = 4;
  OBSERVATION_TYPE_TOOL        = 5;
  OBSERVATION_TYPE_CHAIN       = 6;
  OBSERVATION_TYPE_RETRIEVER   = 7;
  OBSERVATION_TYPE_EMBEDDING   = 8;
  OBSERVATION_TYPE_GUARDRAIL   = 9;
}

enum ObservationLevel {
  OBSERVATION_LEVEL_UNSPECIFIED = 0;
  OBSERVATION_LEVEL_DEBUG       = 1;
  OBSERVATION_LEVEL_DEFAULT     = 2;
  OBSERVATION_LEVEL_WARNING     = 3;
  OBSERVATION_LEVEL_ERROR       = 4;
}

enum ScoreDataType {
  SCORE_DATA_TYPE_UNSPECIFIED = 0;
  SCORE_DATA_TYPE_NUMERIC     = 1;
  SCORE_DATA_TYPE_CATEGORICAL = 2;
  SCORE_DATA_TYPE_BOOLEAN     = 3;
}


// A container for one agent run. Note how little is on it — everything that
// used to live here (input, output, latency, model, tokens) moved to
// Observation, because an agent run has many of each.
message TraceBody {
  string id                                       = 1;
  optional string name                            = 2;
  optional string user_id                         = 3;
  optional string session_id                      = 4;
  optional google.protobuf.Timestamp timestamp    = 5;

  optional string input                           = 6;
  optional string output                          = 7;

  optional google.protobuf.Struct metadata        = 8;
  repeated string tags                            = 9;

  // Code version that produced this trace — makes "did quality regress after
  // the v1.4 deploy?" answerable.
  optional string release                         = 10;
  optional string version                         = 11;

  // Set by the experiment runner so eval traffic can be excluded from
  // production cost and latency dashboards.
  optional bool is_experiment                     = 12;
}

// One node in the trace tree. Used by BOTH observation_create and
// observation_update; on update the server applies it as a sparse patch.
message ObservationBody {
  string id                                                 = 1;
  string trace_id                                           = 2;
  // Unset = root observation. THE field that makes waterfalls possible.
  optional string parent_observation_id                     = 3;

  optional ObservationType type                             = 4;
  optional string name                                      = 5;

  optional google.protobuf.Timestamp start_time             = 6;
  optional google.protobuf.Timestamp end_time               = 7;
  // When the first streamed token arrived; server derives TTFT from it.
  optional google.protobuf.Timestamp completion_start_time  = 8;

  optional ObservationLevel level                           = 9;
  // Exception type + message when the wrapped call raised. The v1 SDK emitted
  // nothing on failure, so errors were invisible — this is the fix.
  optional string status_message                            = 10;

  optional string input                                     = 11;
  optional string output                                    = 12;
  optional google.protobuf.Struct metadata                  = 13;

  // --- GENERATION only ---------------------------------------------------
  optional string model                                     = 20;
  optional google.protobuf.Struct model_parameters          = 21;

  // Maps, not fixed fields: {"input": 1200, "output": 340, "cache_read": 800}.
  // New token types ship faster than schema migrations do.
  map<string, uint64> usage_details                         = 22;
  // Optional. If the SDK knows the real cost it sends it; otherwise the server
  // resolves it from the price table. Both are stored separately so a bad
  // price table can be re-run without losing what the client reported.
  map<string, double> cost_details                          = 23;

  optional string prompt_name                               = 24;
  optional int32  prompt_version                            = 25;
}

// A quality measurement. Anchors to a trace (optionally to one observation
// inside it) or to a dataset run item — exactly one anchor.
message ScoreBody {
  string id                            = 1;

  optional string trace_id             = 2;
  optional string observation_id       = 3;
  optional string dataset_run_item_id  = 4;

  string name                          = 5;
  optional ScoreDataType data_type     = 6;
  optional double value                = 7;   // NUMERIC / BOOLEAN
  optional string string_value         = 8;   // CATEGORICAL

  optional string comment              = 9;
  // `source` is deliberately NOT on the wire — it is derived server-side from
  // the credential, so an SDK cannot claim its score came from a human.
}


message Event {
  // Client-generated UUID, stable across retries.
  string event_id                     = 1;
  // When the SDK created the event, not when the server received it. Needed to
  // order create/update pairs that arrive out of order over the queue.
  google.protobuf.Timestamp timestamp = 2;

  oneof body {
    TraceBody       trace_create       = 10;
    ObservationBody observation_create = 11;
    ObservationBody observation_update = 12;
    ScoreBody       score_create       = 13;
  }
}

message IngestBatchRequest {
  repeated Event events = 1;
  // e.g. "openweave-python/2.0.1". Log it — when someone reports bad data the
  // first question is always which SDK build produced it.
  string sdk = 2;
}

message EventError {
  string event_id = 1;
  int32  code     = 2;   // 400 validation, 403 wrong project, 429, 500
  string message  = 3;
}

message IngestBatchResponse {
  int32 accepted             = 1;
  repeated EventError errors = 2;
}

message HealthRequest {}

message HealthResponse {
  bool   ok       = 1;
  string version  = 2;
  bool   redis_ok = 3;
}


service IngestionService {
  // Auth: `authorization: Basic base64(public_key:secret_key)` metadata header.
  // project_id is resolved from the key server-side and is deliberately NOT a
  // field on any message above, so a client cannot write into another project.
  rpc IngestBatch(IngestBatchRequest) returns (IngestBatchResponse);

  // For k8s liveness/readiness probes. v1's deployments had none, so a wedged
  // pod stayed in the Service's endpoint list indefinitely.
  rpc Health(HealthRequest) returns (HealthResponse);
}
