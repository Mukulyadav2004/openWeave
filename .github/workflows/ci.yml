name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # The suite calls drop_all/create_all, so it gets a throwaway database of
      # its own. Never point TEST_DATABASE_URL at a database you care about.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openweave
          POSTGRES_PASSWORD: openweave
          POSTGRES_DB: openweave_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openweave"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://openweave:openweave@localhost:5432/openweave_test
      DATABASE_URL: postgresql://openweave:openweave@localhost:5432/openweave_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "sqlalchemy>=2.0" alembic asyncpg psycopg2-binary greenlet \
            "redis>=5" grpcio grpcio-tools protobuf \
            fastapi uvicorn httpx pydantic jsonschema \
            pytest pytest-asyncio
        # greenlet is required by SQLAlchemy's asyncio support and is not always
        # pulled in automatically (notably on macOS arm64).

      - name: Generate gRPC stubs
        run: bash agent-observability/proto/generate.sh

      - name: Apply the Alembic migration
        working-directory: agent-observability/worker
        run: alembic upgrade head

      - name: Warn if the migration has drifted from the models
        working-directory: agent-observability/worker
        # Advisory, not blocking: autogenerate is unreliable with Computed
        # columns and CHECK constraints, so a diff here needs a human to read
        # it rather than a red build. Two sources of schema truth silently
        # diverging is still the failure worth watching for.
        continue-on-error: true
        run: alembic check

      - name: Run tests
        working-directory: agent-observability
        run: pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff (errors only)
        # E9/F63/F7/F82 are syntax errors, broken comparisons and undefined
        # names — real bugs, not style. Style rules are deliberately not
        # enforced: a build that goes red over line length teaches people to
        # ignore the build.
        run: ruff check agent-observability --select E9,F63,F7,F82 --output-format=github

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        # The image every deployed service runs; a broken build should fail here,
        # not on the first deploy.
        run: docker build -t openweave agent-observability
